name: Generate Site
run-name: ${{ github.actor }} is generating the site
on: [push]
jobs:
  generate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 site_generator.py
      - uses: actions/upload-pages-artifact@v5
        with:
          name: generated-site
          path: out

  publish-site:
    runs-on: ubuntu-latest
    needs: generate-site
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: generated-site

